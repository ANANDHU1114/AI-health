apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-symptom-checker
  labels:
    app: ai-symptom-checker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-symptom-checker
  template:
    metadata:
      labels:
        app: ai-symptom-checker
    spec:
      containers:
      - name: main-app
        # This image path will be overwritten by GitHub Actions or Ansible dynamically during deployment
        image: aihealthacrdevops.azurecr.io/ai-symptom-checker:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        env:
        - name: DEPLOYMENT_ENV
          value: "Production"

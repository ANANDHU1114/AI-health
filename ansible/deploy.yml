---
- name: Deploy AI Symptom Checker to Kubernetes
  hosts: localhost
  connection: local
  tasks:
    - name: Ensure Kubernetes namespace exists (default)
      kubernetes.core.k8s:
        name: default
        api_version: v1
        kind: Namespace
        state: present

    - name: Apply Deployment configuration
      kubernetes.core.k8s:
        state: present
        src: ../k8s/deployment.yaml

    - name: Apply Service configuration (LoadBalancer)
      kubernetes.core.k8s:
        state: present
        src: ../k8s/service.yaml

    - name: Verify Replicas are scaling correctly
      command: kubectl get deployment ai-symptom-checker
      register: deploy_status
      changed_when: false

    - name: Display Deployment Status
      debug:
        msg: "{{ deploy_status.stdout_lines }}"

    - name: Wait for LoadBalancer IP allocation
      command: kubectl get svc ai-symptom-checker-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      register: lb_ip
      retries: 10
      delay: 15
      until: lb_ip.stdout != ""
      changed_when: false
      ignore_errors: yes

    - name: Display Public Access IP
      debug:
        msg: "Application successfully published at: http://{{ lb_ip.stdout }}"
      when: lb_ip.stdout != ""
